# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pak
        run: install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/%s/%s/%s/%s", "stable", .Platform$pkgType, R.Version()$os, R.Version()$arch))
        shell: Rscript {0}

      - name: Install non-CRAN dependencies (hard deps only)
        run: |
          pak::repo_add(bbuchsbaum = "https://bbuchsbaum.r-universe.dev")
          pak::pkg_install(c(
            "bbuchsbaum/fmriAR",
            "bbuchsbaum/delarr",
            "bbuchsbaum/neurosurf",
            "bbuchsbaum/fmrihrf",
            "bbuchsbaum/fmridesign",
            "bbuchsbaum/fmrilss",
            "bbuchsbaum/fmrigds",
            "bbuchsbaum/neuroim2",
            "bbuchsbaum/fmridataset",
            "bbuchsbaum/fmrireg",
            "bbuchsbaum/neuroatlas"
          ), dependencies = NA)
        shell: Rscript {0}

      - name: Install package with suggests
        run: |
          pak::repo_add(bbuchsbaum = "https://bbuchsbaum.r-universe.dev")
          pak::pkg_install(c("any::pkgdown", "local::."), dependencies = TRUE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          clean: false
          branch: gh-pages
          folder: docs
